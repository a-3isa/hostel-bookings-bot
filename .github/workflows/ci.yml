name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    name: Bot (offline tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_version/requirements.txt
      - name: Install Python packages
        run: pip install -r python_version/requirements.txt "psycopg[binary]"
      - name: Brain, rows, reports and sheet lookup (Node)
        run: |
          node booking_bot/test_brain.mjs
          node booking_bot/test_rows.mjs
          node booking_bot/test_reports.mjs
          node booking_bot/test_sheet_lookup.mjs
      - name: Workflow build and checks (Python)
        run: python -m pytest -q booking_bot
        env:
          # push_brain.py picks an n8n server when imported. These placeholders
          # satisfy it; nothing in the tests connects to them.
          N8N_MCP_URL: http://n8n.invalid/mcp-server/http
          N8N_MCP_TOKEN: placeholder
      - name: Retired Supabase scripts (Python)
        run: python -m pytest -q supabase
      - name: Retired Python bot (Python)
        run: python -m pytest -q python_version/tests

  webui:
    name: Web dashboard (build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Tests
        run: node --test lib/mirror.test.mjs
